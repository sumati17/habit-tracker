<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Habit Tracker</h1>
        <p>Small Habits, Big changes.</p>

        <div class="dashboard">
            <div class="stat-card">
                <h2 id="totalHabits">0</h2>
                <p>Total Habits</p>
            </div>

            <div class="stat-card">
                <h2 id="completedToday">0</h2>
                <p>Completed Today</p>
            </div>

            <div class="stat-card">
                <h2 id="progressPercentage">0%</h2>
                <p>Today's Progress</p>
            </div>
        </div>
        <div class="add-habit">
    <input type="text" id="habitInput" placeholder="Enter a new habit">

    <select id="habitCategory">
        <option value="Fitness"> Fitness</option>
        <option value="Learning"> Learning</option>
        <option value="Health"> Health</option>
        <option value="Personal"> Personal</option>
    </select>

    <button id="addHabitBtn">Add Habit</button>
</div>

        <div id="habitList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
